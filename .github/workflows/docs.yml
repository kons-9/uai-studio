name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - introduction.md
      - host_app/*/sample/*.png
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean --strict
      - name: Build introduction slides
        run: |
          npx --yes @marp-team/marp-cli introduction.md -o site/introduction.html
          # The slides reference these sample images by repository-relative paths.
          for tool in ai_model_monitor cpu_task_monitor; do
            mkdir -p "site/host_app/$tool/sample"
            cp "host_app/$tool/sample/$tool.png" "site/host_app/$tool/sample/"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
