name: C/C++ Format

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install clang-format 21
        run: python -m pip install clang-format==21.1.8
      - name: Check C/C++ formatting
        env:
          CLANG_FORMAT: clang-format
        run: bash build-system/scripts/format.sh --check