# One source of truth for the fixed sample-ai2 memory map.
#
# The generator emits both static_memory_layout.hpp and the reservation part
# of the linker script.  Values may be written as hexadecimal bytes or with
# K/M/G suffixes.  The same schema is accepted as JSON or TOML.
schema_version: 1
header_guard: UAI_AI_STATIC_MEMORY_LAYOUT_HPP
cpp_namespace: uai::ai::static_memory_layout
symbol_prefix: sample_ai

memory_regions:
  - name: APP
    attributes: rwx
    origin: 0x34000400
    length: 1023K
  - name: MODEL_FLASH
    attributes: rx
    origin: 0x70500000
    length: 0x00E00000
  - name: PSRAM_CAPTURE
    attributes: rwx
    origin: 0x91000000
    length: 0x00200000
  - name: PSRAM_DISPLAY
    attributes: rwx
    origin: 0x91200000
    length: 0x00200000
  - name: PSRAM_INFERENCE
    attributes: rwx
    origin: 0x91400000
    length: 0x00300000
  - name: PSRAM_RAW_DUMP
    attributes: rwx
    origin: 0x91700000
    length: 0x00400000
  - name: PSRAM_MASK
    attributes: rwx
    origin: 0x91B00000
    length: 0x00040000
  - name: PSRAM_PIPE2_DROP
    attributes: rwx
    origin: 0x91B40000
    length: 0x00100000
  - name: PSRAM_SCRATCH
    attributes: rwx
    origin: 0x91D00000
    length: 0x00100000
  - name: PSRAM_INFERENCE_SOURCE
    attributes: rwx
    origin: 0x91E00000
    length: 0x00200000

allocations:
  # Keep the APP reservation before __end in the linker template.
  - name: thread_monitor
    key: kThreadMonitor
    memory: APP
    section: sample_ai_thread_monitor
    size: 0x00020000
