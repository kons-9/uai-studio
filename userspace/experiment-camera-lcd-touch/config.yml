# experiment-camera-lcd-touch: STM32N6570-DK camera, touch, and buttons

The experiment displays the on-board IMX335 preview, reads GT911 touch coordinates, and composites
four test buttons into double-buffered RGB565 display frames. See `README.md` for the touch behavior
and display composition policy.

Startup, I2C, external-memory, LCD, camera, and touch support use the board configuration and
STM32CubeN6 BSP.

Build with:

```sh
make -C userspace/experiment-camera-lcd-touch \
  STM32CUBE_N6_DIR=/home/toshiki/STM32Cube/Repository/STM32Cube_FW_N6_V1.3.0 \
  CUBEMX_EXECUTABLE=/home/toshiki/STM32CubeMX/STM32CubeMX \
  setup
```
