site_name: μAI-Studio
site_description: μT-Kernel 3.0向けエッジAI開発環境
site_author: Toshiki Goto
site_url: https://kons-9.github.io/uai-studio/
repo_url: https://github.com/kons-9/uai-studio
repo_name: kons-9/uai-studio
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Toshiki Goto

docs_dir: docs
site_dir: site

nav:
  - ホーム: index.md
  - はじめに: getting-started.md
  - 紹介スライド: https://kons-9.github.io/uai-studio/introduction.html
  - カーネル:
      - 概要: kernel/index.md
      - ビルド構成: kernel/build.md
      - 起動の流れ: kernel/boot.md
      - μT-Kernel: kernel/utkernel.md
      - 共通基盤（foundation）: kernel/common.md
      - アプリの追加: kernel/new-app.md
  - ドライバー: driver.md
  - ミドルウェア:
      - 概要: middleware/index.md
      - buffer: middleware/buffer.md
      - message_channel: middleware/message_channel.md
      - ai_runtime: middleware/ai_runtime.md
      - memory: middleware/memory.md
      - memory_manager: middleware/memory_manager.md
      - ai_model_monitor: middleware/ai_model_monitor.md
      - cpu_task_monitor: middleware/cpu_task_monitor.md
      - image_resizer: middleware/image_resizer.md
      - image_processing: middleware/image_processing.md

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
